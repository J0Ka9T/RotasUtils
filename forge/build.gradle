plugins {
    id 'com.github.johnrengelman.shadow'
}

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
}

loom {
    forge {
        mixinConfig "rotasutils.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    easyNpcConfigOriginal {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

// Upstream Config UI 7.12.1 repeats Core's MixinConfigs manifest entry without
// containing that file. Loom requires a declaring jar to own the mixin config.
// Normalize only this dev dependency; Core still registers the actual mixins.
dependencies {
    easyNpcConfigOriginal "maven.modrinth:easy-npc-config-ui:$rootProject.easy_npc_config_forge_version"
}
def configUiDev = providers.provider {
    def configUiOriginal = configurations.easyNpcConfigOriginal.singleFile
    def configUiDigest = java.security.MessageDigest.getInstance('SHA-256')
            .digest(configUiOriginal.bytes).encodeHex().toString()
    def configUiPatched = layout.buildDirectory.file("easy-npc/config-ui-${configUiDigest}-loom.jar").get().asFile
    if (!configUiPatched.exists()) {
        configUiPatched.parentFile.mkdirs()
        new java.util.jar.JarFile(configUiOriginal).withCloseable { source ->
            def manifest = new java.util.jar.Manifest(source.manifest)
            def duplicateMixin = manifest.mainAttributes.remove(new java.util.jar.Attributes.Name('MixinConfigs'))
            if (duplicateMixin != 'easy_npc.forge.mixins.json'
                    || source.getJarEntry('easy_npc.forge.mixins.json') != null) {
                throw new GradleException('Easy NPC Config UI packaging changed; review the dev manifest workaround')
            }
            new java.util.jar.JarOutputStream(new FileOutputStream(configUiPatched), manifest).withCloseable { output ->
                source.entries().each { entry ->
                    if (!entry.name.equalsIgnoreCase('META-INF/MANIFEST.MF')) {
                        output.putNextEntry(new java.util.jar.JarEntry(entry.name))
                        if (!entry.directory) source.getInputStream(entry).withCloseable { output << it }
                        output.closeEntry()
                    }
                }
            }
        }
    }

    return configUiPatched
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"
    modRuntimeOnly files(rootProject.lenloruiArtifact(
            "${rootProject.lenlorui_project}/forge/build/libs/LenlorUI-forge-${rootProject.lenlorui_version}.jar"))
    // The Curios API is compiled against directly so the bridge can honour its unequip rules; the
    // mod itself stays optional at runtime and metadata keeps it non-mandatory.
    modCompileOnly "top.theillusivec4.curios:curios-forge:5.14.1+1.20.1"
    // Iron's Spells 'n Spellbooks: the Celestial school and its spells compile against the server's own
    // jars. Optional at runtime - nothing Iron's-related loads unless the mod is present.
    modCompileOnly files("libs/irons_spellbooks-1.20.1-3.16.1.jar", "libs/irons_lib-1.20.1-1.1.0.jar",
            "libs/geckolib-forge-1.20.1-4.8.4.jar")
    // Same jars (plus Iron's own dependencies) in the dev client, so forge:runClient can test the spells.
    modRuntimeOnly files("libs/irons_spellbooks-1.20.1-3.16.1.jar", "libs/irons_lib-1.20.1-1.1.0.jar",
            "libs/geckolib-forge-1.20.1-4.8.4.jar", "libs/player-animation-lib-forge-1.0.2-rc1+1.20.jar",
            "libs/caelus-forge-3.2.0+1.20.1.jar")
    // Epic Fight 20.14.17, the version the MILLENUS pack runs: the extra skill-book skills compile
    // against it, and it is optional at runtime (nothing Epic Fight-related loads without it).
    modCompileOnly files("libs/epic-fight-20.14.17-mc1.20.1-forge.jar")
    modRuntimeOnly files("libs/epic-fight-20.14.17-mc1.20.1-forge.jar")
    // GeckoLib ships mclib as a nested jar; a plain file dependency does not unpack it in dev.
    forgeRuntimeLibrary files("libs/mclib-20.jar")
    // Loom remaps Curios for the Forge userdev mappings before forge:runClient.
    modRuntimeOnly "top.theillusivec4.curios:curios-forge:5.14.1+1.20.1"

    // Core and the in-world editor are separate artifacts in Easy NPC 7.12.1.
    modRuntimeOnly "maven.modrinth:easy-npc-core:$rootProject.easy_npc_forge_version"
    modRuntimeOnly files(configUiDev)
    // Additional test mods; do not duplicate the pinned Easy NPC artifacts here.
    modRuntimeOnly fileTree(dir: rootProject.file("forge/dev-mods"), include: ["*.jar"])
    forgeRuntimeLibrary "org.yaml:snakeyaml:2.2"
    // Oculus nests jcpp as a Fabric-style jar, which Forge userdev does not unpack.
    forgeRuntimeLibrary fileTree(dir: rootProject.file("forge/dev-libs"), include: ["*.jar"])

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
