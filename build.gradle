plugins {
    id 'dev.architectury.loom' version '1.14-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

ext.lenloruiArtifact = { String relativePath ->
    return providers.provider {
        File artifact = new File(rootProject.projectDir.parentFile, relativePath)
        if (!artifact.isFile()) {
            throw new GradleException("LenlorUI artifact not found: ${artifact}\n"
                    + "RotasUtils depends on the sibling ${rootProject.lenlorui_project} project.\n"
                    + "Build it first:  cd ../${rootProject.lenlorui_project} && gradlew build")
        }
        artifact
    }
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        maven { url = "https://maven.theillusivec4.top/" }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 17
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {   
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        repositories {
        }
    }
}
